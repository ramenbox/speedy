name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swiftc --version

      - name: Run checks
        run: ./checks.sh

      - name: Build app
        run: ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Speedy
          path: build/Speedy.zip
          if-no-files-found: error
