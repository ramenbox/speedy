name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          app_version=$(sed -n 's/^readonly app_version="\(.*\)"$/\1/p' build.sh)
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app_version \"${app_version}\" in build.sh"
            exit 1
          fi

      - name: Run checks
        run: ./checks.sh

      - name: Build app
        run: ./build.sh

      - name: Read release notes from CHANGELOG.md
        run: ./Tools/release-notes.sh "${GITHUB_REF_NAME#v}" > build/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/Speedy.zip --title "Speedy ${GITHUB_REF_NAME}" --notes-file build/release-notes.md
